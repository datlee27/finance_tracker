name: personal_finance_tracker
description: "Personal Finance Tracker - PRM393 Practical Exam"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.14.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.9

  # State management
  provider: ^6.1.5

  # Internationalization & formatting
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.2
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
